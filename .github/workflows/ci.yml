name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install binary runtime and notebook/build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install -e '.[notebooks,dev]'
      - name: Unit and localhost integration tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce transport acceptance trials
        run: python verify_chat.py --output work/acceptance
      - name: Execute all scientific notebooks
        run: python scripts/execute_notebooks.py --output work/executed-notebooks
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate installed console commands
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          quantum-chat --message 'Public release smoke test'
          quantum-viewer --bits 11 --shots 1 > /dev/null
